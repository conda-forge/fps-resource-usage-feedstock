schema_version: 1

context:
  version: "0.10.3"

package:
  name: fps-resource-usage
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/fps-resource-usage/fps_resource_usage-${{ version }}.tar.gz
    sha256: 75ebedafbe5d1cf3924154162c72218dcb5fb01af7e6d5a1502620ee3760058b

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - anyio
    - fps
    - jupyverse-api >=0.15.0,<0.16.0
    - jupyverse-auth >=0.2.0,<0.3.0
    - jupyverse-resource-usage >=0.1.2,<0.2.0
    - psutil >=5.9.4
    - types-psutil

tests:
  - python:
      imports: fps_resource_usage
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/plugins/resource_usage
  summary: An FPS plugin for the resource usage API

extra:
  recipe-maintainers:
    - davidbrochart
